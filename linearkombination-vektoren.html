<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Linearkombination von Vektoren — Applet</title>
<script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  html, body { margin: 0; padding: 0; font-family: -apple-system, system-ui, sans-serif; background: #F7F8FA; }
  #root { padding: 12px; }
</style>
</head>
<body>
<!-- Katalogisiert von Dewey · Original: c1-mng/Applets/linearkombination-vektoren.jsx · benötigt Internetzugriff (React/Babel per CDN).
     Sichtbarer grauer Info-Banner auf cr-Wunsch 2026-08-20 entfernt (Publikum sind Schüler);
     der orange ALTE-VERSION-Warnbanner der Archiv-Wrapper bleibt bewusst bestehen. -->
<div id="root"></div>
<script type="text/plain" id="app-source">
const { useState, useMemo, useRef, useEffect, useCallback } = React;

// =============================================================================
//  Linearkombination von Vektoren  (Kapitel 1.5, Klasse 2g)
//  Zwei feste Vektoren a, b. Der Nutzer zieht die Spitze von c frei umher;
//  ein ein-/ausblendbares schräges a/b-Gitter deckt die Zerlegung c = x a + y b
//  auf. Workflow: c setzen -> x,y selbst schätzen -> Gitter+Lösung einblenden.
// =============================================================================

// ---------- feste mathematische Daten (identisch zur gedruckten Abbildung) ----
const A = { x: 1.4, y: 0.2 };
const B = { x: 0.5, y: 1.2 };
const C_DEFAULT_FACTORS = { x: 2, y: 1.5 }; // gedrucktes Beispiel: c = 2a + 1.5b
const DET = A.x * B.y - A.y * B.x; // Determinante fuer die Cramer'sche Regel

function factorsToCart(x, y) {
  return { x: x * A.x + y * B.x, y: x * A.y + y * B.y };
}
function cartToFactors(cx, cy) {
  // Cramer'sche Regel: x = (c_x b_y - c_y b_x)/D,  y = (a_x c_y - a_y c_x)/D
  return {
    x: (cx * B.y - cy * B.x) / DET,
    y: (A.x * cy - A.y * cx) / DET,
  };
}
function clamp(v, lo, hi) {
  return Math.max(lo, Math.min(hi, v));
}

// ---------- Zeichenflaeche ---------------------------------------------------
const W = 600;
const H = 460;
const PAD = 50;

// Fest gewaehlter Weltausschnitt, unabhaengig vom Clamp gewaehlt (umfasst O, a,
// b und das gedruckte Beispiel c grosszuegig). Bewusst NICHT aus dem Clamp
// abgeleitet: so ist der ziehbare Bereich an den sichtbaren Canvas gekoppelt,
// nicht umgekehrt (sonst deckt der Clamp nur einen Teil der Zeichenflaeche ab).
const BOX = { xmin: -1.5, xmax: 5.5, ymin: -1.5, ymax: 4 };

// ISOTROPE Skalen: EINE gemeinsame px-pro-Einheit-Skala fuer x UND y, sonst
// verzerrt sich der Winkel zwischen a und b optisch.
function makeIsoScales(box) {
  const worldW = box.xmax - box.xmin;
  const worldH = box.ymax - box.ymin;
  const availW = W - 2 * PAD;
  const availH = H - 2 * PAD;
  const s = Math.min(availW / worldW, availH / worldH); // px pro Welteinheit
  const offX = PAD + (availW - worldW * s) / 2;
  const offY = PAD + (availH - worldH * s) / 2;
  const sx = (x) => offX + (x - box.xmin) * s; // Welt -> px
  const sy = (y) => H - offY - (y - box.ymin) * s; // Welt -> px (y nach oben)
  const isx = (px) => (px - offX) / s + box.xmin; // px -> Welt
  const isy = (py) => (H - offY - py) / s + box.ymin; // px -> Welt
  return { sx, sy, isx, isy, s };
}

const SC = makeIsoScales(BOX);

// Tatsaechlich sichtbarer Weltausschnitt (ganzes SVG inkl. der isotropen
// "Letterbox"-Raender), aus den Pixel-Ecken zurueckgerechnet.
const VIS = {
  xmin: SC.isx(0),
  xmax: SC.isx(W),
  ymin: SC.isy(H),
  ymax: SC.isy(0),
};

// Begrenzung der ziehbaren c-Spitze -- weiterhin im FAKTOR-Raum definiert (damit
// das schraege a/b-Gitter stimmig bleibt), aber so weit aufgezogen, dass die
// zugehoerige Parallelogramm-Flaeche praktisch den ganzen sichtbaren Bereich
// abdeckt: die vier VIS-Ecken (minus schmaler Rand) in Faktoren umrechnen und je
// Faktor-Achse min/max nehmen. Da die Abbildung affin ist, enthaelt das Bild
// dieser Faktor-Box die gesamte VIS-Flaeche -- jeder sichtbare Punkt ist somit
// erreichbar.
const CLAMP = (() => {
  const b = 0.3; // Randbreite in Welteinheiten
  const f = [
    [VIS.xmin + b, VIS.ymin + b],
    [VIS.xmax - b, VIS.ymin + b],
    [VIS.xmin + b, VIS.ymax - b],
    [VIS.xmax - b, VIS.ymax - b],
  ].map(([x, y]) => cartToFactors(x, y));
  const fx = f.map((p) => p.x);
  const fy = f.map((p) => p.y);
  return {
    xmin: Math.min(...fx),
    xmax: Math.max(...fx),
    ymin: Math.min(...fy),
    ymax: Math.max(...fy),
  };
})();

// Gitter etwas grosszuegiger als der Clamp-Bereich (auf ganze Faktoren gerundet,
// plus ein Schritt Reserve), damit ueberall dort, wo c hingezogen werden kann,
// Gitterlinien liegen.
const GRID = (() => {
  const m = 1; // ein Faktor-Schritt Reserve
  return {
    xmin: Math.floor(CLAMP.xmin) - m,
    xmax: Math.ceil(CLAMP.xmax) + m,
    ymin: Math.floor(CLAMP.ymin) - m,
    ymax: Math.ceil(CLAMP.ymax) + m,
  };
})();

// ---------- Farben -----------------------------------------------------------
const COL = {
  ink: "#24435F", // dunkelblau (a, b neutral)
  cVec: "#12263A", // c kraeftig/dunkel
  orange: "#D9720A",
  orangeDark: "#B0590A",
  green: "#1F9E6B",
  greenDark: "#127A50",
  grid: "#D8D5CE",
  frame: "#E4E1D9",
};

// ---------- Vektor-Notation (robust, ohne heikle Unicode-Kombizeichen) -------
// HTML: Buchstabe mit einem darübergesetzten "→" (U+2192 ist ueberall vorhanden).
function VecSym({ l, color, weight }) {
  return (
    <span
      style={{
        position: "relative",
        display: "inline-block",
        fontStyle: "italic",
        fontFamily: "Georgia, 'Times New Roman', serif",
        fontWeight: weight,
        color: color || "inherit",
        padding: "0 0.06em",
        lineHeight: 1,
      }}
    >
      {l}
      <span
        style={{
          position: "absolute",
          left: "-0.04em",
          right: "-0.10em",
          top: "-0.60em",
          fontSize: "0.72em",
          lineHeight: 1,
          textAlign: "center",
          fontStyle: "normal",
          fontWeight: 400,
          pointerEvents: "none",
        }}
      >
        →
      </span>
    </span>
  );
}

// SVG: Buchstabe mit manuell gezeichnetem Pfeilchen darüber (rendert überall gleich).
function VecLabelSvg({ cx, y, letter, color, size = 16, weight }) {
  const half = size * 0.3;
  const topY = y - size * 0.92;
  const sw = Math.max(1.4, size * 0.08);
  const ax2 = cx + half + sw;
  return (
    <g>
      <text
        x={cx}
        y={y}
        fontSize={size}
        fill={color}
        fontFamily="Georgia, serif"
        fontStyle="italic"
        fontWeight={weight}
        textAnchor="middle"
      >
        {letter}
      </text>
      <line
        x1={cx - half}
        y1={topY}
        x2={ax2}
        y2={topY}
        stroke={color}
        strokeWidth={sw}
        strokeLinecap="round"
      />
      <path
        d={`M ${ax2 - sw * 2.2} ${topY - sw * 1.5} L ${ax2} ${topY} L ${
          ax2 - sw * 2.2
        } ${topY + sw * 1.5}`}
        fill="none"
        stroke={color}
        strokeWidth={sw}
        strokeLinecap="round"
        strokeLinejoin="round"
      />
    </g>
  );
}

// Pfeilspitzen-Marker (userSpaceOnUse -> feste Groesse unabhaengig von strokeWidth)
function ArrowMarker({ id, color, size = 12 }) {
  return (
    <marker
      id={id}
      viewBox="0 0 10 10"
      refX="8.5"
      refY="5"
      markerWidth={size}
      markerHeight={size}
      markerUnits="userSpaceOnUse"
      orient="auto-start-reverse"
    >
      <path d="M1,1 L9,5 L1,9 z" fill={color} />
    </marker>
  );
}

// Vektorpfeil als SVG-Linie mit Markerspitze
function Vec({ from, to, color, width, markerId }) {
  return (
    <line
      x1={SC.sx(from.x)}
      y1={SC.sy(from.y)}
      x2={SC.sx(to.x)}
      y2={SC.sy(to.y)}
      stroke={color}
      strokeWidth={width}
      strokeLinecap="round"
      markerEnd={`url(#${markerId})`}
    />
  );
}

function LinearkombinationVektoren() {
  // c (Cartesian-Tip) ist der EINZIGE State; x, y werden daraus abgeleitet.
  const cDefaultCart = factorsToCart(C_DEFAULT_FACTORS.x, C_DEFAULT_FACTORS.y);
  const [c, setC] = useState(cDefaultCart);
  const [showGrid, setShowGrid] = useState(false);

  const svgRef = useRef(null);
  const draggingRef = useRef(false);
  const bodyStyleRef = useRef({ touchAction: "", overflow: "" });

  // x, y live aus der Tip-Position (exakt, nicht gerastert)
  const { x: fx, y: fy } = useMemo(() => cartToFactors(c.x, c.y), [c]);

  const O = { x: 0, y: 0 };
  const xaTip = factorsToCart(fx, 0); // Spitze von x*a

  // ---- Drag-Handling (skalierungsinvariant, funktioniert auch unter scale()) ----
  function updateFromEvent(e) {
    const svg = svgRef.current;
    if (!svg) return;
    const rect = svg.getBoundingClientRect();
    // Anteil in [0,1] -> haelt den CSS-Skalierungsfaktor heraus
    const px = ((e.clientX - rect.left) / rect.width) * W;
    const py = ((e.clientY - rect.top) / rect.height) * H;
    const wx = SC.isx(px);
    const wy = SC.isy(py);
    // in Faktoren umrechnen, DORT clampen, dann zurueck nach Cartesian
    const f = cartToFactors(wx, wy);
    const cx = clamp(f.x, CLAMP.xmin, CLAMP.xmax);
    const cy = clamp(f.y, CLAMP.ymin, CLAMP.ymax);
    setC(factorsToCart(cx, cy));
  }

  function lockBodyScroll() {
    // Ursprungswerte merken und Seiten-Scroll fuer die Dauer des Drags sperren.
    // Zuverlaessiger als touch-action allein, das auf SVG-Elementen (v.a. iOS/WebKit)
    // inkonsistent respektiert wird.
    bodyStyleRef.current = {
      touchAction: document.body.style.touchAction,
      overflow: document.body.style.overflow,
    };
    document.body.style.touchAction = "none";
    document.body.style.overflow = "hidden";
  }
  function unlockBodyScroll() {
    document.body.style.touchAction = bodyStyleRef.current.touchAction;
    document.body.style.overflow = bodyStyleRef.current.overflow;
  }

  function onPointerDown(e) {
    e.preventDefault();
    draggingRef.current = true;
    lockBodyScroll();
    setShowGrid(false); // Loesung verschwindet SOFORT beim Anfassen
    try {
      e.target.setPointerCapture(e.pointerId);
    } catch (_) {}
    updateFromEvent(e);
  }
  function onPointerMove(e) {
    if (!draggingRef.current) return;
    e.preventDefault();
    updateFromEvent(e);
  }
  function onPointerUp(e) {
    draggingRef.current = false;
    unlockBodyScroll();
    try {
      e.target.releasePointerCapture(e.pointerId);
    } catch (_) {}
  }

  function reset() {
    setC(cDefaultCart);
    setShowGrid(false);
  }

  // ---- Gitterlinien (zwei Scharen, parallel zu a bzw. b) ----
  const gridLines = useMemo(() => {
    const lines = [];
    for (let k = GRID.xmin; k <= GRID.xmax; k++) {
      lines.push([factorsToCart(k, GRID.ymin), factorsToCart(k, GRID.ymax)]); // parallel zu b, durch k*a
    }
    for (let k = GRID.ymin; k <= GRID.ymax; k++) {
      lines.push([factorsToCart(GRID.xmin, k), factorsToCart(GRID.xmax, k)]); // parallel zu a, durch k*b
    }
    return lines;
  }, []);

  const fxTxt = fx.toFixed(2);
  const fyTxt = fy.toFixed(2);
  const cPx = { x: SC.sx(c.x), y: SC.sy(c.y) };

  return (
    <div
      style={{
        fontFamily:
          "ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif",
        background: "#F7F6F3",
        minHeight: "100vh",
        padding: "20px 10px",
        color: "#1E2430",
        boxSizing: "border-box",
        touchAction: "none",
      }}
    >
      <div style={{ maxWidth: 760, margin: "0 auto", touchAction: "none" }}>
        <h1
          style={{
            fontFamily: "Georgia, 'Times New Roman', serif",
            fontSize: 25,
            fontWeight: 700,
            margin: "0 0 4px 0",
            letterSpacing: "-0.01em",
          }}
        >
          Linearkombination von Vektoren
        </h1>
        <p style={{ fontSize: 14, color: "#5B6472", margin: "0 0 16px 0" }}>
          Ziehe die Spitze von <VecSym l="c" color={COL.cVec} weight={700} />.
          Schätze zuerst selbst, wie oft <VecSym l="a" /> und <VecSym l="b" />{" "}
          hineinpassen — dann blende das Gitter zur Kontrolle ein.
        </p>

        {/* Zeichenflaeche */}
        <div
          style={{
            background: "#FFFFFF",
            border: `1px solid ${COL.frame}`,
            borderRadius: 12,
            padding: 6,
            touchAction: "none",
          }}
        >
          <svg
            ref={svgRef}
            width="100%"
            viewBox={`0 0 ${W} ${H}`}
            role="img"
            aria-label="Vektor c als Linearkombination von a und b mit schrägem Gitter"
            style={{
              display: "block",
              width: "100%",
              maxWidth: "100%",
              touchAction: "none",
            }}
          >
            <defs>
              <ArrowMarker id="mk-ab" color={COL.ink} />
              <ArrowMarker id="mk-c" color={COL.cVec} size={14} />
              <ArrowMarker id="mk-x" color={COL.orange} size={13} />
              <ArrowMarker id="mk-y" color={COL.green} size={13} />
            </defs>

            {/* schräges a/b-Gitter — nur bei showGrid */}
            {showGrid &&
              gridLines.map(([p0, p1], i) => (
                <line
                  key={`g-${i}`}
                  x1={SC.sx(p0.x)}
                  y1={SC.sy(p0.y)}
                  x2={SC.sx(p1.x)}
                  y2={SC.sy(p1.y)}
                  stroke={COL.grid}
                  strokeWidth="1"
                />
              ))}

            {/* Zerlegungspfad O -> x a -> c  (nur bei showGrid) */}
            {showGrid && (
              <>
                <Vec from={O} to={xaTip} color={COL.orange} width={4} markerId="mk-x" />
                <Vec from={xaTip} to={c} color={COL.green} width={4} markerId="mk-y" />
                {/* Beschriftung der Zerlegungsstuecke (Koeffizient + Vektorname) */}
                <text
                  x={(SC.sx(O.x) + SC.sx(xaTip.x)) / 2}
                  y={(SC.sy(O.y) + SC.sy(xaTip.y)) / 2 + 18}
                  fontSize="15"
                  fill={COL.orangeDark}
                  fontFamily="Georgia, serif"
                  fontStyle="italic"
                  textAnchor="middle"
                >
                  x·a
                </text>
                <text
                  x={(SC.sx(xaTip.x) + cPx.x) / 2 + 12}
                  y={(SC.sy(xaTip.y) + cPx.y) / 2 + 4}
                  fontSize="15"
                  fill={COL.greenDark}
                  fontFamily="Georgia, serif"
                  fontStyle="italic"
                >
                  y·b
                </text>
              </>
            )}

            {/* Grundvektoren a und b (immer sichtbar) */}
            <Vec from={O} to={A} color={COL.ink} width={2.4} markerId="mk-ab" />
            <Vec from={O} to={B} color={COL.ink} width={2.4} markerId="mk-ab" />
            <VecLabelSvg cx={SC.sx(A.x) + 20} y={SC.sy(A.y) - 8} letter="a" color={COL.ink} size={17} />
            <VecLabelSvg cx={SC.sx(B.x) - 16} y={SC.sy(B.y) - 6} letter="b" color={COL.ink} size={17} />

            {/* Vektor c (immer sichtbar) */}
            <Vec from={O} to={c} color={COL.cVec} width={3.4} markerId="mk-c" />
            <VecLabelSvg cx={cPx.x + 16} y={cPx.y - 12} letter="c" color={COL.cVec} size={18} weight={700} />

            {/* Ursprung */}
            <circle cx={SC.sx(0)} cy={SC.sy(0)} r="3.5" fill={COL.ink} />

            {/* sichtbarer Griff an der Spitze von c */}
            <circle cx={cPx.x} cy={cPx.y} r="5.5" fill="#2A6DB5" stroke="#FFFFFF" strokeWidth="1.5" />
            {/* grosser unsichtbarer Hit-Kreis (fingerfreundlich, >= 44px auch bei ~0.5x-Skalierung) */}
            <circle
              cx={cPx.x}
              cy={cPx.y}
              r="42"
              fill="transparent"
              style={{ cursor: "grab", touchAction: "none" }}
              onPointerDown={onPointerDown}
              onPointerMove={onPointerMove}
              onPointerUp={onPointerUp}
              onPointerCancel={onPointerUp}
            />
          </svg>
        </div>

        {/* Steuerzeile: Gitter-Checkbox + Reset */}
        <div
          style={{
            display: "flex",
            alignItems: "center",
            justifyContent: "space-between",
            margin: "12px 2px 0 2px",
            flexWrap: "wrap",
            gap: 10,
          }}
        >
          <label
            style={{
              fontSize: 15,
              color: "#1E2430",
              display: "flex",
              alignItems: "center",
              gap: 8,
              cursor: "pointer",
              userSelect: "none",
            }}
          >
            <input
              type="checkbox"
              checked={showGrid}
              onChange={(e) => setShowGrid(e.target.checked)}
              style={{ width: 18, height: 18 }}
            />
            Gitter &amp; Lösung anzeigen
          </label>
          <button
            onClick={reset}
            style={{
              padding: "6px 14px",
              borderRadius: 8,
              border: `1px solid ${COL.frame}`,
              background: "#FFFFFF",
              color: "#5B6472",
              fontSize: 13,
              cursor: "pointer",
              fontFamily: "Georgia, serif",
            }}
          >
            Zurücksetzen
          </button>
        </div>

        {/* Ergebnis-Kacheln (x orange, y grün) */}
        <div
          style={{
            marginTop: 18,
            display: "grid",
            gridTemplateColumns: "1fr 1fr",
            gap: 12,
            alignItems: "stretch",
          }}
        >
          <div style={{ background: "#FFF3E8", border: "1px solid #F0CBA0", borderRadius: 10, padding: 14 }}>
            <div style={{ fontSize: 13, color: COL.orangeDark }}>
              Anteil in Richtung <VecSym l="a" color={COL.orangeDark} />
            </div>
            <div
              style={{
                fontFamily: "ui-monospace, Menlo, monospace",
                fontSize: 22,
                fontWeight: 700,
                color: COL.orangeDark,
                marginTop: 6,
              }}
            >
              x = {showGrid ? fxTxt : "?"}
            </div>
          </div>
          <div style={{ background: "#E4F5EC", border: "1px solid #A6DABF", borderRadius: 10, padding: 14 }}>
            <div style={{ fontSize: 13, color: COL.greenDark }}>
              Anteil in Richtung <VecSym l="b" color={COL.greenDark} />
            </div>
            <div
              style={{
                fontFamily: "ui-monospace, Menlo, monospace",
                fontSize: 22,
                fontWeight: 700,
                color: COL.greenDark,
                marginTop: 6,
              }}
            >
              y = {showGrid ? fyTxt : "?"}
            </div>
          </div>
        </div>

        {/* Formelzeile */}
        <div
          style={{
            marginTop: 12,
            background: "#FFFFFF",
            border: `1px solid ${COL.frame}`,
            borderRadius: 10,
            padding: "12px 14px",
            textAlign: "center",
            fontFamily: "Georgia, 'Times New Roman', serif",
            fontSize: 21,
          }}
        >
          <VecSym l="c" color={COL.cVec} weight={700} />
          <span style={{ margin: "0 8px" }}>=</span>
          <span style={{ color: COL.orangeDark, fontWeight: 700 }}>{showGrid ? fxTxt : "x"}</span>
          <span style={{ margin: "0 3px 0 5px" }}>·</span>
          <VecSym l="a" color={COL.orangeDark} />
          <span style={{ margin: "0 8px" }}>+</span>
          <span style={{ color: COL.greenDark, fontWeight: 700 }}>{showGrid ? fyTxt : "y"}</span>
          <span style={{ margin: "0 3px 0 5px" }}>·</span>
          <VecSym l="b" color={COL.greenDark} />
        </div>

        <p style={{ fontSize: 12.5, color: "#8A8A8A", margin: "12px 2px 0 2px", lineHeight: 1.5 }}>
          <VecSym l="a" /> = (1,4 | 0,2), <VecSym l="b" /> = (0,5 | 1,2) sind fest.
          Beim Anfassen von <VecSym l="c" /> verschwindet die Lösung automatisch —
          so kannst du erst schätzen und dann prüfen.
        </p>
      </div>
    </div>
  );
}

ReactDOM.render(React.createElement(LinearkombinationVektoren), document.getElementById("root"));
</script>
<script>
// Bewusst kein data-presets-Auto-Scan (Babel Standalones eingebauter
// "type=text/babel"-Mechanismus): der scannt den Quelltext, transformiert ihn
// mit dem *automatic* JSX-Runtime-Default (aktuelle Babel-Standalone-Version
// von unpkg) und injiziert das Ergebnis als neues <script>. Der automatic-
// Runtime-Output enthält aber ein "import ... from 'react/jsx-runtime'" —
// das bricht in einem klassischen (nicht type=module) Script mit
// "Cannot use import statement outside a module" und das Applet rendert
// nie (leeres #root, aber kein sichtbarer Fehler ohne Konsole). Deshalb hier
// explizit mit runtime="classic" transformieren, passend zum global via
// UMD/CDN geladenen React/ReactDOM (kein ES-Modul-Kontext vorhanden).
(function () {
  var source = document.getElementById("app-source").textContent;
  var compiled = Babel.transform(source, {
    presets: [["react", { runtime: "classic" }]],
  }).code;
  (0, eval)(compiled);
})();
</script>
</body>
</html>
