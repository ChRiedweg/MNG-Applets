<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Senkrechte Projektion und Zerlegung — Applet</title>
<script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  html, body { margin: 0; padding: 0; font-family: -apple-system, system-ui, sans-serif; background: #F7F8FA; }
  #root { padding: 12px; }
</style>
</head>
<body>
<!-- Katalogisiert von Dewey · Original: c1-mng/Applets/projektion-vektoren.jsx · benötigt Internetzugriff (React/Babel per CDN).
     Sichtbarer grauer Info-Banner auf cr-Wunsch 2026-08-20 entfernt (Publikum sind Schüler);
     der orange ALTE-VERSION-Warnbanner der Archiv-Wrapper bleibt bewusst bestehen. -->
<div id="root"></div>
<script type="text/plain" id="app-source">
const { useState, useMemo, useRef, useEffect, useCallback } = React;

// =============================================================================
//  Senkrechte Projektion und Zerlegung  (Kapitel 1.6, Klasse 2g)
//  Ein fester Vektor v (die Richtung, auf die projiziert wird) und ein Vektor w
//  mit festem Fusspunkt O, dessen Spitze frei ziehbar ist. Auf Wunsch wird die
//  geometrische Konstruktion des "Schattens" eingeblendet: Traegergerade, Lot,
//  Lotfusspunkt, w_||v (kollinear) und w_⊥v (senkrecht) sowie ein rechter Winkel.
//  Bewusst OHNE Zahlenwerte -- die Formel kommt erst in Kapitel 5 (Skalarprodukt);
//  hier zaehlt nur das anschauliche Verstaendnis der Zerlegung w = w_||v + w_⊥v.
//  Workflow: w setzen -> selbst schaetzen, wo der Schatten landet -> Konstruktion
//  einblenden. Beim Anfassen von w verschwindet sie sofort wieder.
// =============================================================================

// ---------- feste mathematische Daten (wie in der gedruckten Abbildung) -------
const V = { x: 2.6, y: 0.6 }; // Richtung, auf die projiziert wird (leicht geneigt)
const W_DEFAULT = { x: 1.7, y: 1.4 }; // gedrucktes Beispiel
const VV = V.x * V.x + V.y * V.y; // |v|^2

// Senkrechte Projektion von w auf die Gerade durch v: Fusspunkt des Lots.
// (allgemein formuliert, damit v spaeter aenderbar bliebe; hier ist v fix)
function projFoot(w) {
  const t = (w.x * V.x + w.y * V.y) / VV;
  return { x: t * V.x, y: t * V.y };
}
function clamp(v, lo, hi) {
  return Math.max(lo, Math.min(hi, v));
}
function norm(p) {
  return Math.hypot(p.x, p.y);
}

// ---------- Zeichenflaeche ---------------------------------------------------
const W = 600;
const H = 460;
const PAD = 50;

// Fest gewaehlter Weltausschnitt, der O und die Spitze von v grosszuegig umfasst.
const BOX = { xmin: -1.3, xmax: 3.8, ymin: -1.9, ymax: 2.9 };

// ISOTROPE Skalen: EINE gemeinsame px-pro-Einheit-Skala fuer x UND y, sonst
// verzerren sich Winkel (insbesondere der rechte Winkel!) optisch.
function makeIsoScales(box) {
  const worldW = box.xmax - box.xmin;
  const worldH = box.ymax - box.ymin;
  const availW = W - 2 * PAD;
  const availH = H - 2 * PAD;
  const s = Math.min(availW / worldW, availH / worldH); // px pro Welteinheit
  const offX = PAD + (availW - worldW * s) / 2;
  const offY = PAD + (availH - worldH * s) / 2;
  const sx = (x) => offX + (x - box.xmin) * s; // Welt -> px
  const sy = (y) => H - offY - (y - box.ymin) * s; // Welt -> px (y nach oben)
  const isx = (px) => (px - offX) / s + box.xmin; // px -> Welt
  const isy = (py) => (H - offY - py) / s + box.ymin; // px -> Welt
  return { sx, sy, isx, isy, s };
}

const SC = makeIsoScales(BOX);

// Tatsaechlich sichtbarer Weltausschnitt (ganzes SVG inkl. der isotropen
// "Letterbox"-Raender), aus den Pixel-Ecken zurueckgerechnet.
const VIS = {
  xmin: SC.isx(0),
  xmax: SC.isx(W),
  ymin: SC.isy(H),
  ymax: SC.isy(0),
};

// Begrenzung der ziehbaren w-Spitze: praktisch der ganze sichtbare Bereich,
// nur ein schmaler Rand bleibt frei, damit Griff und Pfeilspitze nicht anstossen.
const CLAMP = (() => {
  const b = 0.3; // Randbreite in Welteinheiten
  return {
    xmin: VIS.xmin + b,
    xmax: VIS.xmax - b,
    ymin: VIS.ymin + b,
    ymax: VIS.ymax - b,
  };
})();

// ---------- Farben (aus dem Skript: hier paedagogisch bedeutsam!) ------------
const COL = {
  v: "#2A6DB5", // blau  -> v (Projektionsrichtung)
  w: "#CC2E28", // rot   -> w
  par: "#1E2430", // schwarz/dunkel -> w_||v (kollinear zu v)
  perp: "#8A3FA6", // violett -> w_⊥v (senkrecht zu v)
  rail: "#8FB5DE", // blasses Blau -> Traegergerade (analog blue!40)
  lot: "#9AA0AA", // grau -> Lotlinie (gestrichelt)
  frame: "#E4E1D9",
  ink: "#24435F",
};

// ---------- Vektor-Notation (robust, ohne heikle Unicode-Kombizeichen) -------
// HTML: Buchstabe mit einem darübergesetzten "→".
function VecSym({ l, color, weight }) {
  return (
    <span
      style={{
        position: "relative",
        display: "inline-block",
        fontStyle: "italic",
        fontFamily: "Georgia, 'Times New Roman', serif",
        fontWeight: weight,
        color: color || "inherit",
        padding: "0 0.06em",
        lineHeight: 1,
      }}
    >
      {l}
      <span
        style={{
          position: "absolute",
          left: "-0.04em",
          right: "-0.10em",
          top: "-0.60em",
          fontSize: "0.72em",
          lineHeight: 1,
          textAlign: "center",
          fontStyle: "normal",
          fontWeight: 400,
          pointerEvents: "none",
        }}
      >
        →
      </span>
    </span>
  );
}

// HTML: Relationssymbol (∥ bzw. ⊥) als selbst gezeichnetes Mini-SVG. Bewusst
// KEIN Unicode ∥ (U+2225) / ⊥ (U+22A5): deren Groesse und Grundlinie schwanken
// font-abhaengig -- dieselbe Unzuverlaessigkeit, die beim ersten Applet zum
// selbst gezeichneten Vektorpfeil gefuehrt hat. Die viewBox ist so gewaehlt, dass
// die gezeichnete Unterkante mit der Textgrundlinie zusammenfaellt (vertical-align
// baseline), damit das Symbol wie eine echte Glyphe auf der Grundlinie sitzt.
function RelSymbol({ kind, color, weight }) {
  const sw = weight >= 700 ? 15 : 12; // Strichstaerke passend zum umgebenden Gewicht
  const common = {
    stroke: color || "currentColor",
    strokeWidth: sw,
    strokeLinecap: "round",
    fill: "none",
  };
  return (
    <svg
      viewBox="0 0 100 100"
      style={{
        height: "0.82em",
        width: kind === "par" ? "0.46em" : "0.6em",
        display: "inline-block",
        verticalAlign: "baseline",
        overflow: "visible",
      }}
      aria-hidden="true"
    >
      {kind === "par" ? (
        // parallel: zwei aufrechte Balken
        <g {...common}>
          <line x1="38" y1="8" x2="38" y2="94" />
          <line x1="66" y1="8" x2="66" y2="94" />
        </g>
      ) : (
        // senkrecht: Vertikale trifft auf waagrechte Basis (umgedrehtes T)
        <g {...common}>
          <line x1="50" y1="6" x2="50" y2="94" />
          <line x1="12" y1="94" x2="88" y2="94" />
        </g>
      )}
    </svg>
  );
}

// HTML: w mit Pfeil + echtem Subskript aus Relationssymbol (∥/⊥) und kursivem v.
// Statt <sub> (das Browser-eigene Verkleinerung + Absenkung auf die explizite
// Groesse aufstapelt und so die Grundlinie verwaescht) wird das Subskript hier
// explizit skaliert und mit relativer Position abgesenkt -- ein sauberes,
// vorhersagbares LaTeX-artiges Subskript.
function WSub({ kind, color, weight }) {
  return (
    <span style={{ display: "inline-block", whiteSpace: "nowrap" }}>
      <VecSym l="w" color={color} weight={weight} />
      <span
        style={{
          display: "inline-block",
          position: "relative",
          top: "0.16em", // Absenkung auf die Subskript-Grundlinie
          marginLeft: "0.1em", // Luft zum Pfeil-Buchstaben (nicht gedraengt)
          fontFamily: "Georgia, 'Times New Roman', serif",
          fontSize: "0.7em",
          fontWeight: weight,
          color: color || "inherit",
          lineHeight: 1,
        }}
      >
        <RelSymbol kind={kind} color={color} weight={weight} />
        <span style={{ fontStyle: "italic", marginLeft: "0.05em" }}>v</span>
      </span>
    </span>
  );
}

// SVG: Buchstabe mit manuell gezeichnetem Pfeilchen darüber (rendert überall gleich).
function VecLabelSvg({ cx, y, letter, color, size = 16, weight }) {
  const half = size * 0.3;
  const topY = y - size * 0.92;
  const sw = Math.max(1.4, size * 0.08);
  const ax2 = cx + half + sw;
  return (
    <g>
      <text
        x={cx}
        y={y}
        fontSize={size}
        fill={color}
        fontFamily="Georgia, serif"
        fontStyle="italic"
        fontWeight={weight}
        textAnchor="middle"
      >
        {letter}
      </text>
      <line
        x1={cx - half}
        y1={topY}
        x2={ax2}
        y2={topY}
        stroke={color}
        strokeWidth={sw}
        strokeLinecap="round"
      />
      <path
        d={`M ${ax2 - sw * 2.2} ${topY - sw * 1.5} L ${ax2} ${topY} L ${
          ax2 - sw * 2.2
        } ${topY + sw * 1.5}`}
        fill="none"
        stroke={color}
        strokeWidth={sw}
        strokeLinecap="round"
        strokeLinejoin="round"
      />
    </g>
  );
}

// SVG: w mit Pfeil + tiefgestelltem Relationssymbol (fuer die Konstruktionspfeile).
// Das Subskript-Symbol (∥ bzw. ⊥) wird -- wie in der HTML-Variante RelSymbol --
// aus eigenen SVG-Linien gezeichnet statt als font-abhaengiges Unicode-Zeichen
// (∥ U+2225 / ⊥ U+22A5), das auf manchen Geraeten zu Tofu-Boxen fuehrt. Da wir
// hier schon in SVG-Koordinaten sind, werden die Linien direkt an subX gesetzt.
function WSubLabelSvg({ cx, y, kind, color, size = 15, anchor = "middle" }) {
  const half = size * 0.3;
  const topY = y - size * 0.92;
  const sw = Math.max(1.3, size * 0.08);
  const ax2 = cx + half + sw;
  const subX = cx + half + sw + size * 0.14;
  // Subskript-Metrik (Grundlinie + Groesse wie zuvor beim Text)
  const subFs = size * 0.66;
  const subBase = y + size * 0.22; // Grundlinie des Subskripts
  const symH = subFs * 0.66; // Symbolhoehe ~ Versalhoehe des Subskripts
  const symTop = subBase - symH;
  const symSw = Math.max(1, size * 0.05); // Strichstaerke des Symbols
  const symW = kind === "par" ? subFs * 0.34 : subFs * 0.5; // Symbolbreite
  const vX = subX + symW + size * 0.08; // das kursive v folgt hinter dem Symbol
  return (
    <g>
      <text
        x={cx}
        y={y}
        fontSize={size}
        fill={color}
        fontFamily="Georgia, serif"
        fontStyle="italic"
        textAnchor={anchor}
      >
        w
      </text>
      <line
        x1={cx - half}
        y1={topY}
        x2={ax2}
        y2={topY}
        stroke={color}
        strokeWidth={sw}
        strokeLinecap="round"
      />
      <path
        d={`M ${ax2 - sw * 2.2} ${topY - sw * 1.5} L ${ax2} ${topY} L ${
          ax2 - sw * 2.2
        } ${topY + sw * 1.5}`}
        fill="none"
        stroke={color}
        strokeWidth={sw}
        strokeLinecap="round"
        strokeLinejoin="round"
      />
      {kind === "par" ? (
        // parallel: zwei aufrechte Balken
        <g stroke={color} strokeWidth={symSw} strokeLinecap="round">
          <line x1={subX + symSw} y1={symTop} x2={subX + symSw} y2={subBase} />
          <line
            x1={subX + symW - symSw}
            y1={symTop}
            x2={subX + symW - symSw}
            y2={subBase}
          />
        </g>
      ) : (
        // senkrecht: Vertikale trifft auf waagrechte Basis (umgedrehtes T)
        <g stroke={color} strokeWidth={symSw} strokeLinecap="round">
          <line x1={subX + symW / 2} y1={symTop} x2={subX + symW / 2} y2={subBase} />
          <line x1={subX} y1={subBase} x2={subX + symW} y2={subBase} />
        </g>
      )}
      <text
        x={vX}
        y={subBase}
        fontSize={subFs}
        fill={color}
        fontFamily="Georgia, serif"
        fontStyle="italic"
        textAnchor="start"
      >
        v
      </text>
    </g>
  );
}

// Pfeilspitzen-Marker (userSpaceOnUse -> feste Groesse unabhaengig von strokeWidth)
function ArrowMarker({ id, color, size = 12 }) {
  return (
    <marker
      id={id}
      viewBox="0 0 10 10"
      refX="8.5"
      refY="5"
      markerWidth={size}
      markerHeight={size}
      markerUnits="userSpaceOnUse"
      orient="auto-start-reverse"
    >
      <path d="M1,1 L9,5 L1,9 z" fill={color} />
    </marker>
  );
}

// Vektorpfeil als SVG-Linie mit Markerspitze
function Vec({ from, to, color, width, markerId }) {
  return (
    <line
      x1={SC.sx(from.x)}
      y1={SC.sy(from.y)}
      x2={SC.sx(to.x)}
      y2={SC.sy(to.y)}
      stroke={color}
      strokeWidth={width}
      strokeLinecap="round"
      markerEnd={`url(#${markerId})`}
    />
  );
}

function ProjektionVektoren() {
  // w (kartesische Spitze) ist der EINZIGE State; v bleibt immer fix.
  const [w, setW] = useState(W_DEFAULT);
  const [showConstr, setShowConstr] = useState(false);

  const svgRef = useRef(null);
  const draggingRef = useRef(false);
  const bodyStyleRef = useRef({ touchAction: "", overflow: "" });

  const O = { x: 0, y: 0 };
  const foot = useMemo(() => projFoot(w), [w]); // Lotfusspunkt = Spitze von w_||v

  // ---- Drag-Handling (skalierungsinvariant, funktioniert auch unter scale()) ----
  function updateFromEvent(e) {
    const svg = svgRef.current;
    if (!svg) return;
    const rect = svg.getBoundingClientRect();
    // Anteil in [0,1] -> haelt den CSS-Skalierungsfaktor heraus
    const px = ((e.clientX - rect.left) / rect.width) * W;
    const py = ((e.clientY - rect.top) / rect.height) * H;
    const wx = clamp(SC.isx(px), CLAMP.xmin, CLAMP.xmax);
    const wy = clamp(SC.isy(py), CLAMP.ymin, CLAMP.ymax);
    setW({ x: wx, y: wy });
  }

  function lockBodyScroll() {
    // Ursprungswerte merken und Seiten-Scroll fuer die Dauer des Drags sperren.
    // Zuverlaessiger als touch-action allein, das auf SVG-Elementen (v.a. iOS/WebKit)
    // inkonsistent respektiert wird.
    bodyStyleRef.current = {
      touchAction: document.body.style.touchAction,
      overflow: document.body.style.overflow,
    };
    document.body.style.touchAction = "none";
    document.body.style.overflow = "hidden";
  }
  function unlockBodyScroll() {
    document.body.style.touchAction = bodyStyleRef.current.touchAction;
    document.body.style.overflow = bodyStyleRef.current.overflow;
  }

  function onPointerDown(e) {
    e.preventDefault();
    draggingRef.current = true;
    lockBodyScroll();
    setShowConstr(false); // Konstruktion verschwindet SOFORT beim Anfassen
    try {
      e.target.setPointerCapture(e.pointerId);
    } catch (_) {}
    updateFromEvent(e);
  }
  function onPointerMove(e) {
    if (!draggingRef.current) return;
    e.preventDefault();
    updateFromEvent(e);
  }
  function onPointerUp(e) {
    draggingRef.current = false;
    unlockBodyScroll();
    try {
      e.target.releasePointerCapture(e.pointerId);
    } catch (_) {}
  }

  function reset() {
    setW(W_DEFAULT);
    setShowConstr(false);
  }

  // ---- Traegergerade: durch O in Richtung v, ueber den Ausschnitt verlaengert ----
  const rail = useMemo(() => {
    const len = norm(V);
    const uv = { x: V.x / len, y: V.y / len };
    // So weit verlaengern, dass die Gerade den ganzen sichtbaren Ausschnitt
    // ueberspannt: Eck-Punkte auf die Richtung uv projizieren (gilt fuer beliebig
    // geneigtes v, nicht mehr nur waagrecht).
    const corners = [
      { x: VIS.xmin, y: VIS.ymin },
      { x: VIS.xmin, y: VIS.ymax },
      { x: VIS.xmax, y: VIS.ymin },
      { x: VIS.xmax, y: VIS.ymax },
    ];
    const ts = corners.map((c) => c.x * uv.x + c.y * uv.y);
    const tMin = Math.min(...ts);
    const tMax = Math.max(...ts);
    return {
      a: { x: uv.x * tMin, y: uv.y * tMin },
      b: { x: uv.x * tMax, y: uv.y * tMax },
    };
  }, []);

  // ---- rechter-Winkel-Marker am Lotfusspunkt (nur wenn nicht entartet) ----
  const rightAngle = useMemo(() => {
    const dFoot = norm(foot); // Abstand Fusspunkt <-> O
    const dPerp = norm({ x: w.x - foot.x, y: w.y - foot.y }); // Laenge des Lots
    if (dFoot < 0.12 || dPerp < 0.12) return null; // entartet -> kein Marker
    const r = 0.19; // Bogenradius in Welteinheiten (etwas groesser als frueher s=0.17)
    const uL = { x: -foot.x / dFoot, y: -foot.y / dFoot }; // vom Fuss entlang der Geraden Richtung O
    const uP = {
      x: (w.x - foot.x) / dPerp,
      y: (w.y - foot.y) / dPerp,
    }; // vom Fuss Richtung w
    // Endpunkte des 90deg-Bogens auf den beiden Schenkeln, je Abstand r vom Fuss
    const aStart = { x: foot.x + r * uL.x, y: foot.y + r * uL.y };
    const aEnd = { x: foot.x + r * uP.x, y: foot.y + r * uP.y };
    // Punkt auf der Winkelhalbierenden, innerhalb des Bogens
    const bx = uL.x + uP.x;
    const by = uL.y + uP.y;
    const bn = Math.hypot(bx, by) || 1;
    const dot = {
      x: foot.x + r * 0.5 * (bx / bn),
      y: foot.y + r * 0.5 * (by / bn),
    };
    // Bogenradius in px (isotrope Skala) + Sweep-Flag fuer den kurzen 90deg-Weg.
    // Kreuzprodukt der Radiusvektoren im Bildschirmraum (y-down): >0 => im Uhrzeiger.
    const rPx = r * SC.s;
    const fx = SC.sx(foot.x);
    const fy = SC.sy(foot.y);
    const saX = SC.sx(aStart.x) - fx;
    const saY = SC.sy(aStart.y) - fy;
    const seX = SC.sx(aEnd.x) - fx;
    const seY = SC.sy(aEnd.y) - fy;
    const sweep = saX * seY - saY * seX > 0 ? 1 : 0;
    return { aStart, aEnd, dot, rPx, sweep };
  }, [foot, w]);

  const wPx = { x: SC.sx(w.x), y: SC.sy(w.y) };
  const footPx = { x: SC.sx(foot.x), y: SC.sy(foot.y) };

  return (
    <div
      style={{
        fontFamily:
          "ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif",
        background: "#F7F6F3",
        minHeight: "100vh",
        padding: "20px 10px",
        color: "#1E2430",
        boxSizing: "border-box",
        touchAction: "none",
      }}
    >
      <div style={{ maxWidth: 760, margin: "0 auto", touchAction: "none" }}>
        <h1
          style={{
            fontFamily: "Georgia, 'Times New Roman', serif",
            fontSize: 25,
            fontWeight: 700,
            margin: "0 0 4px 0",
            letterSpacing: "-0.01em",
          }}
        >
          Senkrechte Projektion und Zerlegung
        </h1>
        <p style={{ fontSize: 14, color: "#5B6472", margin: "0 0 16px 0" }}>
          Ziehe die Spitze von <VecSym l="w" color={COL.w} weight={700} />. Wo
          landet sein „Schatten“ auf der Richtung von{" "}
          <VecSym l="v" color={COL.v} weight={700} />? Schätze erst selbst — dann
          blende die Konstruktion zur Kontrolle ein.
        </p>

        {/* Zeichenflaeche */}
        <div
          style={{
            background: "#FFFFFF",
            border: `1px solid ${COL.frame}`,
            borderRadius: 12,
            padding: 6,
            touchAction: "none",
          }}
        >
          <svg
            ref={svgRef}
            width="100%"
            viewBox={`0 0 ${W} ${H}`}
            role="img"
            aria-label="Senkrechte Projektion von w auf die Richtung von v mit Zerlegung in einen kollinearen und einen senkrechten Anteil"
            style={{
              display: "block",
              width: "100%",
              maxWidth: "100%",
              touchAction: "none",
            }}
          >
            <defs>
              <ArrowMarker id="mk-v" color={COL.v} size={13} />
              <ArrowMarker id="mk-w" color={COL.w} size={14} />
              <ArrowMarker id="mk-par" color={COL.par} size={13} />
              <ArrowMarker id="mk-perp" color={COL.perp} size={13} />
            </defs>

            {/* ---- Konstruktion (nur bei showConstr) ---- */}
            {showConstr && (
              <>
                {/* (1) Traegergerade durch v, blass, verlaengert */}
                <line
                  x1={SC.sx(rail.a.x)}
                  y1={SC.sy(rail.a.y)}
                  x2={SC.sx(rail.b.x)}
                  y2={SC.sy(rail.b.y)}
                  stroke={COL.rail}
                  strokeWidth={2}
                  strokeLinecap="round"
                  opacity={0.75}
                />

                {/* (2) Lotlinie von der Spitze von w senkrecht auf die Gerade */}
                <line
                  x1={wPx.x}
                  y1={wPx.y}
                  x2={footPx.x}
                  y2={footPx.y}
                  stroke={COL.lot}
                  strokeWidth={1.6}
                  strokeDasharray="5 4"
                  strokeLinecap="round"
                />

                {/* (4) w_||v (kollinear, schwarz) und w_⊥v (senkrecht, violett) */}
                <Vec from={O} to={foot} color={COL.par} width={4} markerId="mk-par" />
                <Vec from={foot} to={w} color={COL.perp} width={3.2} markerId="mk-perp" />

                {/* (5) rechter-Winkel-Marker am Lotfusspunkt */}
                {rightAngle && (
                  <>
                    <path
                      d={`M ${SC.sx(rightAngle.aStart.x)},${SC.sy(
                        rightAngle.aStart.y
                      )} A ${rightAngle.rPx} ${rightAngle.rPx} 0 0 ${
                        rightAngle.sweep
                      } ${SC.sx(rightAngle.aEnd.x)},${SC.sy(rightAngle.aEnd.y)}`}
                      fill="none"
                      stroke={COL.par}
                      strokeWidth={1.4}
                    />
                    <circle
                      cx={SC.sx(rightAngle.dot.x)}
                      cy={SC.sy(rightAngle.dot.y)}
                      r={1.5}
                      fill={COL.par}
                    />
                  </>
                )}

                {/* (3) Lotfusspunkt markieren */}
                <circle cx={footPx.x} cy={footPx.y} r={4} fill={COL.par} />

                {/* Beschriftung der Zerlegungsstuecke */}
                <WSubLabelSvg
                  cx={(SC.sx(O.x) + footPx.x) / 2}
                  y={SC.sy(0) + 24}
                  kind="par"
                  color={COL.par}
                  size={15}
                />
                <WSubLabelSvg
                  cx={(footPx.x + wPx.x) / 2 + 12}
                  y={(footPx.y + wPx.y) / 2 + 4}
                  kind="perp"
                  color={COL.perp}
                  size={15}
                  anchor="start"
                />
              </>
            )}

            {/* ---- immer sichtbar: v (blau) und w (rot) ---- */}
            <Vec from={O} to={V} color={COL.v} width={3.2} markerId="mk-v" />
            <VecLabelSvg
              cx={SC.sx(V.x) - 10}
              y={SC.sy(V.y) + 24}
              letter="v"
              color={COL.v}
              size={18}
              weight={700}
            />

            <Vec from={O} to={w} color={COL.w} width={3.4} markerId="mk-w" />
            <VecLabelSvg
              cx={wPx.x + 16}
              y={wPx.y - 12}
              letter="w"
              color={COL.w}
              size={18}
              weight={700}
            />

            {/* Ursprung */}
            <circle cx={SC.sx(0)} cy={SC.sy(0)} r="3.5" fill={COL.ink} />

            {/* sichtbarer Griff an der Spitze von w */}
            <circle
              cx={wPx.x}
              cy={wPx.y}
              r="5.5"
              fill={COL.w}
              stroke="#FFFFFF"
              strokeWidth="1.5"
            />
            {/* grosser unsichtbarer Hit-Kreis (fingerfreundlich, >= 44px auch bei ~0.5x-Skalierung) */}
            <circle
              cx={wPx.x}
              cy={wPx.y}
              r="42"
              fill="transparent"
              style={{ cursor: "grab", touchAction: "none" }}
              onPointerDown={onPointerDown}
              onPointerMove={onPointerMove}
              onPointerUp={onPointerUp}
              onPointerCancel={onPointerUp}
            />
          </svg>
        </div>

        {/* Steuerzeile: Konstruktions-Checkbox + Reset */}
        <div
          style={{
            display: "flex",
            alignItems: "center",
            justifyContent: "space-between",
            margin: "12px 2px 0 2px",
            flexWrap: "wrap",
            gap: 10,
          }}
        >
          <label
            style={{
              fontSize: 15,
              color: "#1E2430",
              display: "flex",
              alignItems: "center",
              gap: 8,
              cursor: "pointer",
              userSelect: "none",
            }}
          >
            <input
              type="checkbox"
              checked={showConstr}
              onChange={(e) => setShowConstr(e.target.checked)}
              style={{ width: 18, height: 18 }}
            />
            Konstruktion zeigen
          </label>
          <button
            onClick={reset}
            style={{
              padding: "6px 14px",
              borderRadius: 8,
              border: `1px solid ${COL.frame}`,
              background: "#FFFFFF",
              color: "#5B6472",
              fontSize: 13,
              cursor: "pointer",
              fontFamily: "Georgia, serif",
            }}
          >
            Zurücksetzen
          </button>
        </div>

        {/* Erklaertext -- nur wenn die Konstruktion sichtbar ist (keine Zahlen!) */}
        <div
          style={{
            marginTop: 14,
            minHeight: 58,
            background: showConstr ? "#FFFFFF" : "transparent",
            border: showConstr ? `1px solid ${COL.frame}` : "1px solid transparent",
            borderRadius: 10,
            padding: "12px 14px",
            textAlign: "center",
            fontFamily: "Georgia, 'Times New Roman', serif",
            fontSize: 20,
            transition: "background 0.2s, border-color 0.2s",
          }}
        >
          {showConstr ? (
            <span>
              Zerlegung:&nbsp;
              <VecSym l="w" color={COL.w} weight={700} />
              <span style={{ margin: "0 7px" }}>=</span>
              <WSub kind="par" color={COL.par} weight={700} />
              <span style={{ margin: "0 7px" }}>+</span>
              <WSub kind="perp" color={COL.perp} weight={700} />
            </span>
          ) : (
            <span style={{ fontSize: 13.5, color: "#8A8A8A", fontFamily: "inherit" }}>
              Wo trifft das Lot von <VecSym l="w" /> die Gerade durch <VecSym l="v" />?
            </span>
          )}
        </div>

        <p
          style={{
            fontSize: 12.5,
            color: "#8A8A8A",
            margin: "14px 2px 0 2px",
            lineHeight: 1.55,
          }}
        >
          <VecSym l="v" color={COL.v} /> ist fest; nur <VecSym l="w" color={COL.w} />{" "}
          lässt sich ziehen. <WSub kind="par" color={COL.par} /> ist{" "}
          <b>kollinear</b> zu <VecSym l="v" />, <WSub kind="perp" color={COL.perp} /> steht{" "}
          <b>senkrecht</b> darauf. Eine Formel dafür folgt erst mit dem
          Skalarprodukt — hier zählt nur die Anschauung.
        </p>
      </div>
    </div>
  );
}

ReactDOM.render(React.createElement(ProjektionVektoren), document.getElementById("root"));
</script>
<script>
// Bewusst kein data-presets-Auto-Scan (Babel Standalones eingebauter
// "type=text/babel"-Mechanismus): der scannt den Quelltext, transformiert ihn
// mit dem *automatic* JSX-Runtime-Default (aktuelle Babel-Standalone-Version
// von unpkg) und injiziert das Ergebnis als neues <script>. Der automatic-
// Runtime-Output enthält aber ein "import ... from 'react/jsx-runtime'" —
// das bricht in einem klassischen (nicht type=module) Script mit
// "Cannot use import statement outside a module" und das Applet rendert
// nie (leeres #root, aber kein sichtbarer Fehler ohne Konsole). Deshalb hier
// explizit mit runtime="classic" transformieren, passend zum global via
// UMD/CDN geladenen React/ReactDOM (kein ES-Modul-Kontext vorhanden).
(function () {
  var source = document.getElementById("app-source").textContent;
  var compiled = Babel.transform(source, {
    presets: [["react", { runtime: "classic" }]],
  }).code;
  (0, eval)(compiled);
})();
</script>
